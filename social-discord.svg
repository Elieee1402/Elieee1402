<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 130" width="120" height="130" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A94FF"/>
      <stop offset="1" stop-color="#5865F2"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#5865F2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5865F2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shine" cx="0.3" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <!-- sombra proyectada -->
  <ellipse cx="60" cy="118" rx="22" ry="4" fill="#5865F2" opacity="0.35" filter="url(#soft)">
    <animate attributeName="rx" values="22;16;22" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.18;0.35" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
  </ellipse>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="3.6s" begin="1.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>

    <!-- halo -->
    <circle cx="60" cy="58" r="52" fill="url(#halo)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
    </circle>

    <!-- onda expansiva -->
    <circle cx="60" cy="58" r="36" fill="none" stroke="#5865F2" stroke-width="1.5">
      <animate attributeName="r" values="36;54" dur="2.8s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.8s" begin="1.2s" repeatCount="indefinite"/>
    </circle>

    <!-- anillo giratorio -->
    <circle cx="60" cy="58" r="43" fill="none" stroke="#8A94FF" stroke-width="1.6" stroke-dasharray="3 9" stroke-linecap="round" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="0 60 58" to="360 60 58" dur="14s" repeatCount="indefinite"/>
    </circle>

    <!-- esfera principal -->
    <circle cx="60" cy="58" r="33" fill="url(#fill)"/>
    <circle cx="60" cy="58" r="33" fill="url(#shine)"/>
    <circle cx="60" cy="58" r="33" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.2"/>

    <!-- logo -->
    <g transform="translate(60 58) scale(1.45) translate(-12 -12)" fill="#FFFFFF">
      <path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/>
    </g>

    <!-- destello -->
    <circle cx="82" cy="36" r="2" fill="#FFFFFF">
      <animate attributeName="opacity" values="1;0.1;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
