<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 130" width="120" height="130" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5BCBF5"/>
      <stop offset="1" stop-color="#26A5E4"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#26A5E4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#26A5E4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shine" cx="0.3" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <!-- sombra proyectada -->
  <ellipse cx="60" cy="118" rx="22" ry="4" fill="#26A5E4" opacity="0.35" filter="url(#soft)">
    <animate attributeName="rx" values="22;16;22" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.18;0.35" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
  </ellipse>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="3.6s" begin="1.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>

    <!-- halo -->
    <circle cx="60" cy="58" r="52" fill="url(#halo)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
    </circle>

    <!-- onda expansiva -->
    <circle cx="60" cy="58" r="36" fill="none" stroke="#26A5E4" stroke-width="1.5">
      <animate attributeName="r" values="36;54" dur="2.8s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.8s" begin="1.2s" repeatCount="indefinite"/>
    </circle>

    <!-- anillo giratorio -->
    <circle cx="60" cy="58" r="43" fill="none" stroke="#5BCBF5" stroke-width="1.6" stroke-dasharray="3 9" stroke-linecap="round" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="0 60 58" to="360 60 58" dur="14s" repeatCount="indefinite"/>
    </circle>

    <!-- esfera principal -->
    <circle cx="60" cy="58" r="33" fill="url(#fill)"/>
    <circle cx="60" cy="58" r="33" fill="url(#shine)"/>
    <circle cx="60" cy="58" r="33" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.2"/>

    <!-- logo -->
    <g transform="translate(60 58) scale(1.45) translate(-12 -12)" fill="#FFFFFF">
      <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
    </g>

    <!-- destello -->
    <circle cx="82" cy="36" r="2" fill="#FFFFFF">
      <animate attributeName="opacity" values="1;0.1;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
