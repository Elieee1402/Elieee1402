<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 352 84" width="352" height="84" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="ico" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111B2E"/><stop offset="1" stop-color="#0A101C"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="12" y="12" width="328" height="60" rx="30"/></clipPath>
    <filter id="blur" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <!-- resplandor -->
  <rect x="12" y="15" width="328" height="60" rx="30" fill="url(#stroke)" opacity="0.35" filter="url(#blur)">
    <animate attributeName="opacity" values="0.22;0.5;0.22" dur="4s" begin="0s" repeatCount="indefinite"/>
  </rect>

  <!-- cuerpo -->
  <rect x="12" y="12" width="328" height="60" rx="30" fill="url(#bg)"/>

  <!-- destello que cruza -->
  <g clip-path="url(#clip)">
    <rect x="-131.20000000000002" y="12" width="114.8" height="60" fill="url(#sweep)" transform="skewX(-20)">
      <animate attributeName="x" values="-131.20000000000002;426.40000000000003" dur="4.5s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- borde -->
  <rect x="12" y="12" width="328" height="60" rx="30" fill="none" stroke="url(#stroke)" stroke-width="1.6" opacity="0.9"/>

  <!-- icono -->
  <circle cx="42" cy="42" r="26" fill="none" stroke="#2563EB" stroke-width="1" opacity="0.5">
    <animate attributeName="r" values="24;30" dur="2.8s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="2.8s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="42" cy="42" r="21" fill="url(#ico)"/>
  <g transform="translate(42 42) scale(1.0307499999999998) translate(-12 -12)" fill="#FFFFFF"><path d="M24 22.525H0l12-21.05 12 21.05z"/></g>

  <!-- texto -->
  <text x="76" y="33" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="600" letter-spacing="2.2" fill="#94A3B8">PORTAFOLIO</text>
  <text x="76" y="50" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#F8FAFC" textLength="200" lengthAdjust="spacingAndGlyphs">eliezeralarcon.vercel.app</text>
  <g transform="translate(304 33)" fill="none" stroke="#F8FAFC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="304 33;307 30;304 33" dur="2.2s" repeatCount="indefinite"/>
    <path d="M3 15L15 3M6 3h9v9"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
