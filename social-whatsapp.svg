<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 130" width="120" height="130" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EE08A"/>
      <stop offset="1" stop-color="#25D366"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#25D366" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#25D366" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shine" cx="0.3" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <!-- sombra proyectada -->
  <ellipse cx="60" cy="118" rx="22" ry="4" fill="#25D366" opacity="0.35" filter="url(#soft)">
    <animate attributeName="rx" values="22;16;22" dur="3.6s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.18;0.35" dur="3.6s" begin="0.6s" repeatCount="indefinite"/>
  </ellipse>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="3.6s" begin="0.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>

    <!-- halo -->
    <circle cx="60" cy="58" r="52" fill="url(#halo)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.6s" begin="0.6s" repeatCount="indefinite"/>
    </circle>

    <!-- onda expansiva -->
    <circle cx="60" cy="58" r="36" fill="none" stroke="#25D366" stroke-width="1.5">
      <animate attributeName="r" values="36;54" dur="2.8s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.8s" begin="0.6s" repeatCount="indefinite"/>
    </circle>

    <!-- anillo giratorio -->
    <circle cx="60" cy="58" r="43" fill="none" stroke="#5EE08A" stroke-width="1.6" stroke-dasharray="3 9" stroke-linecap="round" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="0 60 58" to="360 60 58" dur="14s" repeatCount="indefinite"/>
    </circle>

    <!-- esfera principal -->
    <circle cx="60" cy="58" r="33" fill="url(#fill)"/>
    <circle cx="60" cy="58" r="33" fill="url(#shine)"/>
    <circle cx="60" cy="58" r="33" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.2"/>

    <!-- logo -->
    <g transform="translate(60 58) scale(1.45) translate(-12 -12)" fill="#FFFFFF">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
    </g>

    <!-- destello -->
    <circle cx="82" cy="36" r="2" fill="#FFFFFF">
      <animate attributeName="opacity" values="1;0.1;1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
