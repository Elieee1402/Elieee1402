<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 268 74" width="268" height="74" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFA64D"/><stop offset="1" stop-color="#FF8000"/>
    </linearGradient>
    <linearGradient id="ico" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA64D"/><stop offset="1" stop-color="#FF8000"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111B2E"/><stop offset="1" stop-color="#0A101C"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="12" y="12" width="244" height="50" rx="25"/></clipPath>
    <filter id="blur" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <!-- resplandor -->
  <rect x="12" y="15" width="244" height="50" rx="25" fill="url(#stroke)" opacity="0.35" filter="url(#blur)">
    <animate attributeName="opacity" values="0.22;0.5;0.22" dur="4s" begin="0.8s" repeatCount="indefinite"/>
  </rect>

  <!-- cuerpo -->
  <rect x="12" y="12" width="244" height="50" rx="25" fill="url(#bg)"/>

  <!-- destello que cruza -->
  <g clip-path="url(#clip)">
    <rect x="-97.60000000000001" y="12" width="85.39999999999999" height="50" fill="url(#sweep)" transform="skewX(-20)">
      <animate attributeName="x" values="-97.60000000000001;317.2" dur="4.5s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- borde -->
  <rect x="12" y="12" width="244" height="50" rx="25" fill="none" stroke="url(#stroke)" stroke-width="1.6" opacity="0.9"/>

  <!-- icono -->
  <circle cx="37" cy="37" r="21" fill="none" stroke="#FF8000" stroke-width="1" opacity="0.5">
    <animate attributeName="r" values="19;25" dur="2.8s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="2.8s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="37" cy="37" r="16" fill="url(#ico)"/>
  <g transform="translate(37 37) scale(1.2666666666666666) translate(-12 -12)" fill="#FFFFFF"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></g>

  <!-- texto -->
  
  <text x="66" y="42.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#F8FAFC" textLength="158" lengthAdjust="spacingAndGlyphs">Maracaibo, Venezuela</text>
  
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
