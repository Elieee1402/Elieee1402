  <g transform="translate(37 37) scale(1.2666666666666666) translate(-12 -12)" fill="#FFFFFF"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></g>

