<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 130" width="120" height="130" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5AA0FF"/>
      <stop offset="1" stop-color="#1877F2"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#1877F2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1877F2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shine" cx="0.3" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <!-- sombra proyectada -->
  <ellipse cx="60" cy="118" rx="22" ry="4" fill="#1877F2" opacity="0.35" filter="url(#soft)">
    <animate attributeName="rx" values="22;16;22" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.18;0.35" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
  </ellipse>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="3.6s" begin="2.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>

    <!-- halo -->
    <circle cx="60" cy="58" r="52" fill="url(#halo)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- onda expansiva -->
    <circle cx="60" cy="58" r="36" fill="none" stroke="#1877F2" stroke-width="1.5">
      <animate attributeName="r" values="36;54" dur="2.8s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.8s" begin="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- anillo giratorio -->
    <circle cx="60" cy="58" r="43" fill="none" stroke="#5AA0FF" stroke-width="1.6" stroke-dasharray="3 9" stroke-linecap="round" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="0 60 58" to="360 60 58" dur="14s" repeatCount="indefinite"/>
    </circle>

    <!-- esfera principal -->
    <circle cx="60" cy="58" r="33" fill="url(#fill)"/>
    <circle cx="60" cy="58" r="33" fill="url(#shine)"/>
    <circle cx="60" cy="58" r="33" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.2"/>

    <!-- logo -->
    <g transform="translate(60 58) scale(1.45) translate(-12 -12)" fill="#FFFFFF">
      <path d="M9.101 23.691v-7.98H6.627v-3.667h2.474v-1.58c0-4.085 1.848-5.978 5.858-5.978.401 0 .955.042 1.468.103a8.68 8.68 0 0 1 1.141.195v3.325a8.623 8.623 0 0 0-.653-.036 26.805 26.805 0 0 0-.733-.009c-.707 0-1.259.096-1.675.309a1.686 1.686 0 0 0-.679.622c-.258.42-.374.995-.374 1.752v1.297h3.919l-.386 2.103-.287 1.564h-3.246v8.245C19.396 23.238 24 18.179 24 12.044c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.628 3.874 10.35 9.101 11.647Z"/>
    </g>

    <!-- destello -->
    <circle cx="82" cy="36" r="2" fill="#FFFFFF">
      <animate attributeName="opacity" values="1;0.1;1" dur="2.4s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
